launch:
  - group:
      - node:
          pkg: "sinsei_umiusi_core"
          exec: "low_power_health_check"
      - node:
          pkg: "sinsei_umiusi_core"
          exec: "manual_target_generator"
      - node:
          pkg: "sinsei_umiusi_core"
          exec: "auto_target_generator"
          # 落ちたら立ち上げ直す。configure / activate は robot_strategy の Auto がやり直す
          respawn: "true"
          respawn_delay: 1.0
          param:
            - from: "$(find-pkg-share sinsei_umiusi_core)/config/auto_target_generator.yaml"
      - node:
          pkg: "sinsei_umiusi_core"
          exec: "robot_strategy"
          namespace: "robot_strategy"
          param:
            - name: behavior_tree_file
              value: "$(find-pkg-share sinsei_umiusi_core)/behavior_tree/tree_main.xml"
      - node:
          pkg: "rosbridge_server"
          exec: "rosbridge_websocket"
          # 切れた UI（無線が突然切れて TCP の切断が届かない）を数秒で数から外す。既定（ping なし）だと数分残り、
          # /client_count が 0 にならない（2026-10-15 の無線の試験で約 2 分）。AUTO は切れても電源を保つので影響しない
          param:
            - name: websocket_ping_interval
              value: 2.0
            - name: websocket_ping_timeout
              value: 5.0
