# auto_target_generator（風船検出 + 行動決定）のパラメータ。
# 数値は型を合わせること（15 ではなく 15.0）。ROS 2 のパラメータは型が違うと読み込みで落ちる。
# 各項目の意味は sinsei_umiusi_core/balloon/mission.py の MissionParams を参照。
/auto_target_generator:
  ros__parameters:
    # 共有メモリ（control の cameras_shm.yaml）。動画ファイルのパスを入れると再生で試せる
    camera_source: "shmsrc socket-path=/tmp/umiusi_cam1.sock is-live=true ! video/x-raw,format=BGR,width=320,height=240 ! appsink drop=true max-buffers=1 sync=false"
    # 色のしきい値。色合わせの道具（scripts/calibrate_server.py）が保存する current.json を読む。
    # 無ければ同梱の normal.json で動き、保存されたら切り替える（1 秒ごとに見る）。
    # ファイル名だけなら config/balloon/ から探す（例: "normal.json"）。~ も使える
    detector_config: "~/umiusi_balloon/current.json"
    detector_reload_period: 1.0
    # 検出のしかた。"hsv" = 上の色のしきい値、"cnn" = 学習した CNN（色合わせ不要）。
    # 走行中でも ros2 param set /auto_target_generator detector cnn で切り替わる。CNN を読めなければ hsv で続ける
    detector: "hsv"
    # ファイル名だけなら config/balloon/models/ から探す。20261007 = 実機の autonomy で使ってきたもの、
    # 20261015 = ラベルを直して学び直したもの（JAMSTEC で良い、10/03・9/13 は同等以上。実機では未確認）
    cnn_model: "balloon_cnn_20261007.onnx"
    # 確信度の下限。0.4 にすると濁ったプール（10/03）でほぼ全部消える
    cnn_conf: 0.3
    # 推論のスレッド数。Pi で 2 が一番速い（4 だとカメラ・制御とコアを取り合う）
    cnn_threads: 2
    rate_hz: 10.0
    # Auto でない間も認識だけ回して ~/status に出す（UI で認識を確かめる用。推力は出さない）
    preview: true
    max_frame_age: 0.5
    # control の方位保持（hold_yaw）は実機で未検証なので既定は使わない
    use_hold_yaw: false
    # 向きの対応。陸上で確かめ、逆なら -1.0（docs/auto_balloon.md）
    sign_surge: 1.0
    sign_heave: 1.0
    sign_yaw: 1.0
    # 色合わせ用に生フレームを残す。空なら残さない
    save_dir: "/home/pi/runs/auto"
    save_every: 0.5
    mission:
      # AUTO に入れた（= スタートの合図）あと start_delay 秒で動き出し、mission_time 秒で推力 0。
      # AUTO に入るたびに読み直すので、ros2 param set で変えれば次から効く
      start_delay: 10.0
      mission_time: 300.0
      dive_time: 12.0
      dive_heave: -0.4
      approach_surge_far: 0.35
      approach_surge_near: 0.15
      ram_surge: 0.6
      ram_time: 3.0
      backoff_surge: -0.3
      backoff_time: 2.0
      search_yaw_rate: 0.35
      aim_x: 0.0
      aim_y: 0.0
      first_color: "yellow"
      priority: ["red", "yellow"]
